# NFC stack configuration (libnfc-nci) for the Samsung S3NRN80. From AOSP's default
# (packages/modules/Nfc/libnfc-nci/conf); the chip-specific values (RF protocol numbers,
# routing) come from the HAL's getConfig.

NFC_DEBUG_ENABLED=0
NFA_STORAGE="/data/nfc"
PRESERVE_STORAGE=0x01

# Poll for NFC-A, NFC-B, NFC-F and ISO 15693
POLLING_TECH_MASK=0x0F

# No UICC and no reachable eSE (it is behind the secure world): host card emulation only
UICC_LISTEN_TECH_MASK=0x00
NFA_MAX_EE_SUPPORTED=0x00

AID_FOR_EMPTY_SELECT={08:A0:00:00:01:51:00:00:00}
AID_MATCHING_MODE=0x01
NCI_RESET_TYPE=0x00
PRESENCE_CHECK_RETRY_COUNT=0
OPTIMIZE_ROUTING_TABLE_UPDATE=0x00
NFA_EE_ROUTE_DEBOUNCE_TIMER=0x01
KOVIO_PRESENCE_CHECK_TYPE=0x00
RECOVERY_OPTION=1
